name = "psd-product-inequality"
version = "0.1.0"
defaultTargets = ["PsdProduct"]
license = "MIT"

[leanOptions]
warningAsError = true

[[require]]
name = "mathlib"
scope = "leanprover-community"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.36.0"

[[lean_lib]]
name = "PsdProduct"
# PsdProduct.lean uses Lean's non-module import mode.
allowNonModules = true
